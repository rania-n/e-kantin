<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sidebar</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    .sidebar {
      width: 250px;
      height: 100vh;
      background: #6B3740;           /* Warna utama UNGU (deep mauve) */
      border-right: 1px solid #E7CBCB;
      position: fixed;
      left: 0;
      top: 0;
      display: flex;
      flex-direction: column;
      z-index: 100;
      font-family: Arial, sans-serif;
    }

    .logo {
      padding: 24px 20px;
      border-bottom: 1px solid #A86670;
    }

    .logo h2 {
      font-size: 24px;
      color: #EFD9D4;                /* Lightest tone untuk teks cerah */
    }

    .logo p {
      font-size: 13px;
      color: #EFD9D4;
      margin-top: 4px;
    }

    .menu {
      flex: 1;
      padding: 12px 0;
    }

    .menu a {
      display: block;
      padding: 14px 24px;
      text-decoration: none;
      color: #EFD9D4;
      font-size: 14.5px;
      transition: all 0.2s;
    }

    .menu a:hover {
      background: #A86670;           /* Medium mauve untuk hover */
      color: #fff;
    }

    .menu a.active {
      background: #C1848A;           /* Soft pink-mauve untuk active */
      color: #4D262E;                /* Darkest tone untuk kontras teks */
      font-weight: 600;
      border-left: 4px solid #E7CBCB;
    }

    .logout {
      padding: 16px 20px;
      border-top: 1px solid #A86670;
      margin-top: auto;
    }

    .logout a {
      display: block;
      padding: 12px 20px;
      color: #EFD9D4;
      text-decoration: none;
      transition: 0.2s;
    }

    .logout a:hover {
      background: #A86670;
      color: #fff;
      border-radius: 6px;
    }
  </style>
</head>
<body>
  <div class="sidebar">
    <div class="logo">
      <h2>Admin</h2>
      <p>e-Kantin Sekolah</p>
    </div>

    <div class="menu">
      <a href="../../admin/dashboard/dashboard.php" class="active">Dashboard</a>
      <a href="../../admin/manajemenpengguna/user.php">Manajemen Pengguna</a>
      <a href="../../admin/manajementoko/toko.php">Manajemen Toko</a>
      <a href="#">Pengaturan</a>
    </div>

    <div class="logout">
      <a href="#">Keluar</a>
    </div>
  </div>
</body>
</html>
