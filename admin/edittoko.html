<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edit Toko</title>
<link rel="stylesheet" href="edittoko.css">
</head>

<body>

<div class="container">

  <h2>Edit Toko</h2>

  <form class="card">

    <div class="row">
      <label>Nama Toko</label>
      <input type="text" value="Kantin Bu Siti">
    </div>

    <div class="row">
      <label>Username Pemilik</label>
      <input type="text" value="seller1">
    </div>

    <div class="row">
      <label>Status</label>
      <select>
        <option>Aktif</option>
        <option>Nonaktif</option>
      </select>
    </div>

    <div class="buttons">
      <button type="submit" class="btn save">Simpan</button>
      <a href="toko.html" class="btn cancel">Batal</a>
    </div>

  </form>

</div>

</body>
</html>
