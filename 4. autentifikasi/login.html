<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

body{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:linear-gradient(135deg,#ffcf91,#ff5e00);
  padding:clamp(16px, 4vw, 60px);
}

.container{
  width:min(75vw, 900px);
  min-height:55vh;
  background:white;
  padding:clamp(28px, 5vw, 65px);
  border-radius:clamp(16px, 2vw, 24px);
  box-shadow:0 15px 35px rgba(0,0,0,0.2);
  display:flex;
  flex-direction:column;
  justify-content:center;
}

h2{
  text-align:center;
  font-size:clamp(26px, 4vw, 42px);
  margin-bottom:10px;
}

.sub{
  text-align:center;
  font-size:clamp(14px, 2vw, 20px);
  color:#777;
  margin-bottom:clamp(24px, 4vw, 38px);
}

input{
  width:100%;
  padding:clamp(13px, 2vw, 22px);
  font-size:clamp(15px, 2vw, 22px);
  margin-bottom:clamp(14px, 2vw, 22px);
  border-radius:clamp(9px, 1.5vw, 14px);
  border:1px solid #ccc;
}

.pass-wrap{
  position:relative;
}

.eye{
  position:absolute;
  right:clamp(12px, 2vw, 20px);
  top:clamp(13px, 2vw, 22px);
  cursor:pointer;
  font-size:clamp(15px, 2vw, 20px);
}

button{
  width:100%;
  padding:clamp(14px, 2vw, 22px);
  font-size:clamp(15px, 2vw, 22px);
  border:none;
  border-radius:clamp(9px, 1.5vw, 14px);
  background:#d14d00;
  color:white;
  cursor:pointer;
  font-weight:600;
  margin-top:8px;
}

.google{
  background:white;
  color:#333;
  border:1px solid #ccc;
}

.link{
  text-align:center;
  margin-top:clamp(14px, 2vw, 22px);
  font-size:clamp(13px, 1.5vw, 18px);
}

@media (max-width:600px){
  .container{
    width:100%;
    min-height:auto;
  }
}
</style>
</head>

<body>

<div class="container">

  <h2>Login</h2>
  <div class="sub">Masuk sebagai Pembeli</div>

  <input type="text" id="user" placeholder="Username">

  <div class="pass-wrap">
    <input type="password" id="pass" placeholder="Password">
    <span class="eye" onclick="toggle()">👁</span>
  </div>

  <button onclick="login()">Login</button>
  <button class="google" onclick="loginGoogle()">Login dengan Google</button>

  <div class="link">
    Belum punya akun? <a href="register.html">Register</a>
  </div>

</div>

<script>
function toggle(){
  const p = document.getElementById("pass");
  p.type = p.type === "password" ? "text" : "password";
}

function login(){
  const user = document.getElementById("user").value.trim();
  const pass = document.getElementById("pass").value.trim();

  if(user === "" || pass === ""){
    alert("Isi username/email/no HP dan password dulu ya!");
    return;
  }

  window.location.href = "http://localhost/e-kantin/pembeli/index.php";
}

function loginGoogle(){
  alert("Login dengan Google belum dihubungkan, ini masih tampilan frontend.");
  window.location.href = "http://localhost/e-kantin/pembeli/index.php";
}
</script>

</body>
</html>
